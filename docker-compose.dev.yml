services:
  db:
    image: postgres:16-alpine
    container_name: videovitannya-db
    environment:
      POSTGRES_USER: videovitannya
      POSTGRES_PASSWORD: videovitannya
      POSTGRES_DB: videovitannya
    volumes:
      - videovitannya_postgres_data:/var/lib/postgresql/data
    ports:
      - "5556:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videovitannya -d videovitannya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  videovitannya_postgres_data:
