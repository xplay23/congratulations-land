name: videovitannya-platform
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    image: ${APP_IMAGE:?APP_IMAGE must identify the release}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage
      - media:/app/public/media
    networks: [backend, application]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: ${ROUTING_ENABLED:-false}
      traefik.docker.network: videovitannya_application
      traefik.http.routers.videovitannya-platform.rule: Host(`videovitannya.com.ua`) || Host(`www.videovitannya.com.ua`)
      traefik.http.routers.videovitannya-platform.entrypoints: websecure
      traefik.http.routers.videovitannya-platform.tls: "true"
      traefik.http.routers.videovitannya-platform.tls.certresolver: letsencrypt-http
      traefik.http.routers.videovitannya-platform.service: videovitannya-platform
      traefik.http.services.videovitannya-platform.loadbalancer.server.port: "3000"
networks:
  backend:
  application:
    external: true
    name: videovitannya_application
volumes:
  database:
  storage:
  media:
